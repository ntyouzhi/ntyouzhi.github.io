<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乳牙"罢工"记 · 口腔卡通动画（二年级）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"Comic Sans MS","Microsoft YaHei","PingFang SC",sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; background:linear-gradient(180deg,#bfe9ff 0%,#e6f7ff 55%,#d5f5e3 100%); overflow:hidden; }

  /* ====== 场景容器 ====== */
  .scene { position:absolute; inset:0; display:none; }
  .scene.active { display:block; }
  .sky { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

  /* ====== 通用装饰 ====== */
  .cloud { position:absolute; background:#ffffffcc; border-radius:60% 40% 55% 45%; filter:blur(1px); }
  .star { position:absolute; width:14px; height:14px; background:#ffe66d; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); animation:twinkle 1.8s infinite alternate; }
  @keyframes twinkle { from{opacity:.4; transform:scale(.8);} to{opacity:1; transform:scale(1.15);} }

  /* ====== 台词区（顶部横幅，不遮挡画面主体） ====== */
  #caption { position:absolute; left:50%; transform:translateX(-50%); top:5.5%; width:min(94%,1080px); z-index:50; text-align:center; pointer-events:none; }
  .line { display:inline-block; background:rgba(255,255,255,.94); border:3px solid #ffb3c1; border-radius:22px; padding:9px 24px; font-size:clamp(19px,2.9vw,36px); font-weight:900; color:#3a4a5a; box-shadow:0 4px 0 #f8a9bb, 0 12px 24px rgba(0,0,0,.12); opacity:0; transform:translateY(-20px); transition:all .45s ease; }
  .line.show { opacity:1; transform:translateY(0); }
  .sub { margin-top:7px; display:inline-block; background:rgba(255,239,213,.94); border:2.5px solid #ffd28a; border-radius:14px; padding:5px 16px; font-size:clamp(14px,1.8vw,22px); font-weight:700; color:#8a5a2a; opacity:0; transform:translateY(-16px); transition:all .45s ease .25s; }
  .sub.show { opacity:1; transform:translateY(0); }

  /* ====== 控制条 ====== */
  #controls { position:absolute; top:12px; right:12px; z-index:100; display:flex; gap:8px; align-items:center; background:#ffffffd9; padding:8px 14px; border-radius:40px; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #controls button { border:none; background:#ff8fab; color:#fff; font-size:18px; font-weight:900; width:38px; height:38px; border-radius:50%; cursor:pointer; transition:transform .15s; box-shadow:0 3px 0 #d96b84; }
  #controls button:hover { transform:scale(1.12); }
  #controls button:active { transform:translateY(3px); box-shadow:none; }
  #dots { display:flex; gap:7px; }
  #dots span { width:11px; height:11px; border-radius:50%; background:#cbd5e0; cursor:pointer; transition:all .3s; }
  #dots span.on { background:#ff8fab; transform:scale(1.35); }

  /* ====== 标题封面 ====== */
  #titleWrap { position:absolute; top:14%; left:50%; transform:translateX(-50%); text-align:center; z-index:60; width:100%; }
  #bigTitle { font-size:clamp(40px,8vw,96px); font-weight:900; color:#ff6b9d; -webkit-text-stroke:3px #fff; text-shadow:0 6px 0 #e0487e, 0 14px 30px rgba(224,72,126,.35); animation:titlePop 1s ease-out both; }
  #bigTitle .q { color:#6b8cff; }
  @keyframes titlePop { 0%{transform:scale(.3) rotate(-6deg); opacity:0;} 60%{transform:scale(1.08) rotate(2deg);} 100%{transform:scale(1) rotate(0);} }
  #subTitle { margin-top:10px; font-size:clamp(18px,3vw,34px); font-weight:800; color:#fff; display:inline-block; background:#6b8cff; padding:8px 26px; border-radius:40px; box-shadow:0 5px 0 #4762c9; animation:titlePop 1s .4s ease-out both; }
  #patrol { position:absolute; top:46%; left:50%; transform:translateX(-50%); z-index:60; font-size:clamp(16px,2.4vw,28px); font-weight:800; color:#6b8cff; opacity:0; animation:fadeUp 1s .9s ease-out both; }
  #patrol b { color:#ff6b9d; }
#startBtn { position:absolute; top:57%; left:50%; transform:translateX(-50%); z-index:95; border:none; cursor:pointer; background:#ff8fab; color:#fff; font-weight:900; font-size:clamp(20px,3.2vw,36px); padding:16px 40px; border-radius:50px; border:4px solid #fff; box-shadow:0 6px 0 #d96b84, 0 10px 26px rgba(0,0,0,.28); animation:bounce 1.1s ease-in-out infinite; font-family:inherit; }
  #startBtn:hover { transform:translateX(-50%) scale(1.06); }
  #startBtn .arr { display:inline-block; margin-right:8px; }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-8px);} }
  @keyframes fadeUp { from{opacity:0; transform:translateX(-50%) translateY(24px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
  #startOverlay { position:absolute; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(191,233,255,.38); backdrop-filter:blur(2px); }
  #startOverlay.hidden { display:none; }
  #startOverlay #startBtn { position:relative; top:auto; left:auto; transform:none; animation:startPulse 1.1s ease-in-out infinite; }
  #startOverlay #startBtn:hover { transform:scale(1.06); }
  #startOverlay .startHint { display:none; }

  @keyframes startPulse { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px) scale(1.03);} }

/* ====== 角色：牙齿 ====== */
  .tooth { position:absolute; z-index:10; }
  .tooth svg { width:100%; height:100%; display:block; filter:drop-shadow(2px 5px 4px rgba(0,0,0,.12)); }
  .tooth .face { animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }
  .tooth.happy .face { animation:bob 2.2s ease-in-out infinite, blink 4s infinite; }
  @keyframes blink { 0%,92%,100%{transform:translateY(0);} 95%{transform:translateY(-6px) scaleY(.9);} }
  .tooth.wobble .face { animation:shake 1.6s ease-in-out infinite; }
  @keyframes shake { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-5px) rotate(-4deg);} 75%{transform:translateX(5px) rotate(4deg);} }
  .tooth.dark svg #body { fill:#e8e0d8; }
  .tooth.cavity svg #cav { opacity:1; }
  .tooth.cry .face { animation:cryShake .9s ease-in-out infinite; }
  @keyframes cryShake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  .tooth.bow .face { animation:bow 2.4s ease-in-out infinite; }
  @keyframes bow { 0%,100%{transform:rotate(0); transform-origin:50% 88%;} 25%,55%{transform:rotate(-16deg); transform-origin:50% 88%;} 75%{transform:rotate(0);} }

  /* ====== 角色：细菌小怪兽 ====== */
  .bug { position:absolute; z-index:20; }
  .bug svg { width:100%; height:100%; display:block; filter:drop-shadow(2px 4px 4px rgba(0,0,0,.15)); }
  .bug .bface { animation:bugWig 1.6s ease-in-out infinite; }
  @keyframes bugWig { 0%,100%{transform:rotate(0);} 50%{transform:rotate(6deg);} }
  .bug.escape { transition:all 1.2s ease; }
  .bug.flying { animation:flyAway 1.4s ease-in forwards; }
  @keyframes flyAway { 0%{transform:translate(0,0) rotate(0); opacity:1;} 100%{transform:translate(-40px,-180px) rotate(-40deg); opacity:0;} }

  /* ====== 角色：牙刷骑士 ====== */
  .brush { position:absolute; z-index:30; }
  .brush svg { width:100%; height:100%; display:block; filter:drop-shadow(4px 8px 6px rgba(0,0,0,.18)); }
  .brush.tilt { transform:rotate(45deg); }

  /* ====== 特效：酸液泡泡 / 泡沫 / 眼泪 ====== */
  .acid { position:absolute; border-radius:50%; background:radial-gradient(circle at 30% 30%, #e3a4ff, #9b59c9 70%); box-shadow:0 0 14px #b06fd6; z-index:25; }
  .foam { position:absolute; width:28px; height:28px; border-radius:50%; background:#fff; opacity:0; z-index:35; }
  .foam.go { animation:foamPop 1.3s ease-in-out forwards; }
  @keyframes foamPop { 0%{opacity:0; transform:scale(.2);} 25%{opacity:.95; transform:scale(1.1);} 100%{opacity:0; transform:scale(1.9) translateY(-22px);} }
  .tear { position:absolute; width:10px; height:16px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:#7cc7ff; z-index:20; }
  .tear.drop { animation:tearDrop 1.2s ease-in infinite; }
  @keyframes tearDrop { 0%{transform:translateY(0) scale(1); opacity:1;} 80%{transform:translateY(16px) scale(.95); opacity:.9;} 100%{transform:translateY(20px) scale(.8); opacity:0;} }

  /* ====== 场景文字标签 ====== */
  .tag { position:absolute; font-weight:900; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18); z-index:40; }
  .factory-tag { background:#c768e0; border-radius:14px; padding:4px 12px; border:3px dashed #fff; }
  .spoils { position:absolute; z-index:22; }

  /* ====== 场景入场动画 ====== */
  .pop-in { animation:popIn .6s ease-out both; }
  @keyframes popIn { 0%{transform:scale(0); opacity:0;} 70%{transform:scale(1.12); opacity:1;} 100%{transform:scale(1);} }
  .drop-in { animation:dropIn .7s ease-out both; }
  @keyframes dropIn { 0%{transform:translateY(-120px); opacity:0;} 100%{transform:translateY(0); opacity:1;} }
  .rise-in { animation:riseIn 1.6s ease-out both; }
  @keyframes riseIn { 0%{transform:translateY(120px) scale(.6); opacity:0;} 100%{transform:translateY(0) scale(1); opacity:1;} }
  .float-restless { animation:floatY 3s ease-in-out infinite; }
  @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
/* ====== 场景2：酸液攻击 ====== */
  .acid-flight { position:absolute; border-radius:50%; width:26px; height:26px; background:radial-gradient(circle at 30% 30%, #e3a4ff, #9b59c9 70%); box-shadow:0 0 14px #b06fd6; z-index:25; animation:acidFly 2.4s ease-in infinite; }
  @keyframes acidFly { 0%{transform:translate(0,0) scale(.6); opacity:0;} 12%{opacity:1;} 100%{transform:translate(-185px,-14px) scale(1.1); opacity:.9;} }
  .factory { position:absolute; z-index:15; }
  .factory svg { display:block; filter:drop-shadow(4px 6px 5px rgba(0,0,0,.18)); }
  .lolly { position:absolute; z-index:16; }
  .lolly svg { display:block; filter:drop-shadow(2px 3px 3px rgba(0,0,0,.15)); }

  /* ====== 场景3：蛀牙 ====== */
  .badge-warn { position:absolute; z-index:45; background:#ff5252; color:#fff; font-weight:900; padding:8px 18px; border-radius:30px; border:4px solid #ffd0d0; font-size:clamp(18px,2.6vw,30px); box-shadow:0 5px 0 #b71c1c; animation:badgePulse 1.1s ease-in-out infinite; }
  @keyframes badgePulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12) rotate(-3deg);} }
  .bubble-say { position:absolute; z-index:45; background:#fff; border:4px solid #7cc7ff; border-radius:24px; padding:10px 20px; font-size:clamp(20px,2.8vw,32px); font-weight:900; color:#5b8dd9; box-shadow:0 5px 0 #4a7cc9, 0 10px 20px rgba(0,0,0,.12); animation:floatY 2s ease-in-out infinite; }
  .bubble-say::after { content:""; position:absolute; left:18%; bottom:-16px; width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:16px solid #7cc7ff; }

  /* ====== 场景4：刷牙 ====== */
  .brush-swing { animation:brushSwing 1.1s ease-in-out infinite; }
  @keyframes brushSwing { 0%,100%{transform:rotate(45deg) translateX(0);} 50%{transform:rotate(45deg) translateX(26px);} }
  .sparkle { position:absolute; width:16px; height:16px; background:#ffe66d; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); opacity:0; z-index:36; }
  .sparkle.go { animation:spark 1.2s ease-out forwards; }
  @keyframes spark { 0%{opacity:0; transform:scale(.3) rotate(0);} 40%{opacity:1; transform:scale(1.25) rotate(60deg);} 100%{opacity:0; transform:scale(.4) rotate(120deg);} }

  /* ====== 场景5：交接班收尾 ====== */
  .shrink-away { animation:shrinkAway 2s ease-in forwards; }
  @keyframes shrinkAway { 0%{opacity:1; transform:scale(1);} 70%{opacity:.85; transform:scale(.72) translateY(-6px);} 100%{opacity:0; transform:scale(.5) translateY(-16px);} }
  .grow-in { animation:growIn 1.9s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes growIn { 0%{transform:scale(.25) translateY(60px); opacity:0;} 70%{transform:scale(1.08) translateY(-4px); opacity:1;} 100%{transform:scale(1) translateY(0); opacity:1;} }
  .medal { position:absolute; z-index:50; }
  .medal svg { display:block; filter:drop-shadow(2px 4px 4px rgba(0,0,0,.2)); }
  .rainbow-bar { position:absolute; height:14px; z-index:44; border-radius:8px; opacity:.9; }
  #finalSlogan { position:absolute; top:34%; left:50%; transform:translateX(-50%); z-index:60; text-align:center; width:100%; }
  #finalSlogan .s1 { font-size:clamp(26px,4.6vw,52px); font-weight:900; color:#ff6b9d; -webkit-text-stroke:2px #fff; text-shadow:0 4px 0 #e0487e; opacity:0; animation:fadeUp 1s .6s ease-out forwards; }
  #finalSlogan .s2 { margin-top:10px; font-size:clamp(17px,2.6vw,30px); font-weight:800; color:#fff; background:#6b8cff; display:inline-block; padding:8px 24px; border-radius:40px; box-shadow:0 4px 0 #4762c9; opacity:0; animation:fadeUp 1s 1.1s ease-out forwards; }

  /* ====== 恒牙飞入中央：放大 + 闪烁 + 定格 ====== */
  .fly-center { animation:flyToCenter 1.3s cubic-bezier(.22,1,.36,1) .5s both, centerFlash .7s ease-in-out 2s 3; }
  @keyframes flyToCenter {
    0%   { transform:translateX(calc(-52vw - 180px)) scale(.7); opacity:0; }
    16%  { opacity:1; }
    55%  { transform:translateX(5vw) scale(1.04); opacity:1; }
    75%  { transform:translateX(-2vw) scale(1.14); opacity:1; }
    100% { transform:translateX(0) scale(1.08); opacity:1; }
  }
  @keyframes centerFlash {
    0%,100% { filter:brightness(1.05) drop-shadow(0 0 8px rgba(255,255,255,.85)); }
    50%     { filter:brightness(1.9) drop-shadow(0 0 26px #ffe66d); }
  }

  /* ====== 场景4 刷牙流程：挤牙膏→拿开→牙刷登场 ====== */
  #sc4TP { transition:all .7s cubic-bezier(.34,1.56,.64,1); }
  #sc4Brush { right:-300px; transition:all .65s cubic-bezier(.34,1.56,.64,1); }
  #sc4Brush.in { left:25%; right:auto; }
  #sc4Brush.in svg { animation:brushSwing 1.1s ease-in-out infinite; }
  .squirt { position:absolute; z-index:34; left:8%; top:8%; width:84%; transform-origin:center top; transform:scaleY(0); opacity:0; }
  .squirt.go { animation:squirtOut .8s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes squirtOut {
    0% { opacity:0; transform:translateY(-16px) scaleY(.2); }
    45% { opacity:1; transform:translateY(0) scaleY(1); }
    100% { opacity:.95; transform:translateY(0) scaleY(1); }
  }

  /* ====== 二年级优化：幕牌 / 大箭头 / 刷牙互动 / 闯关 / 音效视觉 ====== */
  /* 保留兼容规则；课件正文已不再使用拼音标记 */
  #sceneBadge { position:absolute; top:14px; left:14px; z-index:100; background:#ffffffd9; border-radius:24px; padding:6px 14px; font-size:clamp(13px,1.7vw,20px); font-weight:900; color:#5b8dd9; box-shadow:0 3px 10px rgba(0,0,0,.12); }
  .navBig { position:absolute; bottom:3%; z-index:90; width:64px; height:64px; border:none; border-radius:50%; background:#6b8cff; color:#fff; font-size:26px; font-weight:900; cursor:pointer; box-shadow:0 5px 0 #4762c9, 0 8px 18px rgba(0,0,0,.2); transition:transform .15s; }
  .navBig:hover { transform:scale(1.1); }
  .navBig:active { transform:translateY(4px); box-shadow:none; }
  #sc4HintWrap { position:absolute; left:0; bottom:44%; width:100%; display:none; justify-content:center; z-index:66; pointer-events:none; }
  .tap-hint { background:#ffd23f; color:#7a5a00; font-weight:900; font-size:clamp(16px,2.3vw,26px); padding:8px 18px; border-radius:24px; border:3px solid #fff; box-shadow:0 4px 0 #d9a91f; animation:floatY 1s ease-in-out infinite; }
  #sc4MedalWrap { position:absolute; left:0; bottom:38%; width:100%; display:none; justify-content:center; z-index:66; pointer-events:none; }
  #sc4MedalWrap .medal { position:relative; width:92px; height:110px; }
  .tooth.brushable { cursor:pointer; }
  .tooth.brushable svg { animation:glowPulse 1.4s infinite; }
  @keyframes glowPulse { 0%,100%{filter:drop-shadow(2px 5px 4px rgba(0,0,0,.12)) drop-shadow(0 0 4px #ffd23f);} 50%{filter:drop-shadow(2px 5px 4px rgba(0,0,0,.12)) drop-shadow(0 0 18px #ffd23f);} }
  .tooth.done svg { filter:drop-shadow(0 0 14px #7cc7ff); }
  .tooth.done svg #body { fill:#f3fbff; stroke:#7cc7ff; }
  .tooth.wiggle .face { animation:wig .6s ease-in-out; }
  @keyframes wig { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-6px) rotate(-6deg);} 75%{transform:translateX(6px) rotate(6deg);} }
  .actionTag { position:absolute; z-index:70; background:#fff; color:#5b8dd9; border:3px solid #7cc7ff; border-radius:16px; padding:5px 14px; font-weight:900; font-size:clamp(14px,1.9vw,22px); box-shadow:0 4px 12px rgba(0,0,0,.18); transform:translate(-50%,-50%); pointer-events:none; animation:tagPop 1.5s ease-out forwards; white-space:nowrap; }
  @keyframes tagPop { 0%{opacity:0; transform:translate(-50%,-30%) scale(.6);} 15%{opacity:1; transform:translate(-50%,-50%) scale(1.06);} 80%{opacity:1; transform:translate(-50%,-70%) scale(1);} 100%{opacity:0; transform:translate(-50%,-105%) scale(.95);} }
  .confetti { position:absolute; width:12px; height:18px; top:-6vh; z-index:95; pointer-events:none; animation:confFall 2.4s linear forwards; }
  @keyframes confFall { 0%{transform:translateY(0) rotate(0); opacity:1;} 100%{transform:translateY(112vh) rotate(760deg); opacity:.85;} }
  #quiz { position:absolute; left:50%; bottom:4%; transform:translate(-50%,160%); width:min(92%,720px); z-index:80; background:#ffffffee; border:4px solid #7cc7ff; border-radius:26px; padding:12px 20px 16px; box-shadow:0 10px 30px rgba(0,0,0,.28); transition:transform .7s cubic-bezier(.22,1,.36,1); text-align:center; }
  #quiz.open { transform:translate(-50%,0); }
  #quizTitle { font-size:clamp(18px,2.5vw,28px); font-weight:900; color:#ff6b9d; }
  #quizN { font-size:clamp(12px,1.6vw,17px); font-weight:800; color:#8aa0b8; }
  #quizQ { margin:6px 0 10px; font-size:clamp(20px,3vw,32px); font-weight:900; color:#3a4a5a; }
  #quizOpts button { display:inline-block; margin:5px 8px; min-width:clamp(110px,17vw,190px); padding:11px 16px; font-size:clamp(17px,2.4vw,26px); font-weight:900; color:#fff; background:#ff8fab; border:none; border-radius:18px; box-shadow:0 4px 0 #d96b84; cursor:pointer; transition:transform .12s; }
  #quizOpts button:hover { transform:scale(1.06); }
  #quizOpts button.good { background:#51cf66; box-shadow:0 4px 0 #2f9e44; transform:scale(1.08); }
  #quizOpts button.shake { animation:quizShake .45s; }
  @keyframes quizShake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  #quizMsg.ok { color:#2f9e44; } #quizMsg.no { color:#e8590c; }
  #sc5.quiz-on #finalSlogan { opacity:.25; transition:opacity .8s; }
  #sc5.quiz-on .fly-center { animation:none; transform:translateY(130px) scale(.66); opacity:.12; }
  #credit { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:110; color:rgba(58,74,90,.72); font-size:clamp(12px,1.5vw,17px); font-weight:800; letter-spacing:.3px; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="credit">小果子vibe coding</div>


<!-- ================= 场景0：片头封面 ================= -->
<section class="scene active" id="sc0">
  <div class="sky">
    <div class="cloud" style="top:8%;left:5%;width:170px;height:54px;border-radius:50% 50% 40% 40%;"></div>
    <div class="cloud" style="top:20%;right:6%;width:210px;height:62px;border-radius:45% 55% 60% 40%;opacity:.8;"></div>
    <div class="star" style="top:10%;left:22%;"></div>
    <div class="star" style="top:26%;right:18%;animation-delay:.4s;"></div>
    <div class="star" style="top:6%;left:47%;animation-delay:.8s;"></div>
    <div class="star" style="top:16%;left:70%;animation-delay:1.2s;"></div>
  </div>
  <div id="titleWrap">
    <div id="bigTitle">乳牙<span class="q">“罢工”</span>记</div>
    <div id="subTitle">口腔健康小课堂 · 二年级</div>
  </div>

  }
  function synthesizeXiaoyi(text, rate, pitch){
    var parts = splitForTTS(text), all = [];
    return parts.reduce(function(chain, part){
      return chain.then(function(result){ return edgeTTS(part, XIAOYI, rate || '-5%', pitch || '+0Hz').then(function(buf){ result.push(buf); return result; }); });
    }, Promise.resolve([])).then(function(result){ return new Blob(result, { type:'audio/mpeg' }); });
  }

  function playBlob(blob, generation){
    return new Promise(function(resolve){
      var a = new Audio(), finished = false;
      function finish(){
        if(finished) return;
        finished = true;
        try{ URL.revokeObjectURL(a.src); }catch(e){}
        if(activeSpeakAudio === a) activeSpeakAudio = null;
        resolve();
      }
      activeSpeakAudio = a;
      window._edgeAudioRef = a;
      a.src = URL.createObjectURL(blob);
      a.onended = finish; a.onerror = finish;
      if(generation !== speakGeneration){ finish(); return; }
      a.play().catch(finish);
    });
  }
  function speakFallback(text){
    if(!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      fallbackUtterance = new SpeechSynthesisUtterance(text);
      fallbackUtterance.lang = 'zh-CN'; fallbackUtterance.rate = 0.95; fallbackUtterance.pitch = 1.08;
      var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      for(var i=0;i<voices.length;i++){ if(/^zh(-|_)?CN/i.test(voices[i].lang) && /女|female|xiaoxiao|xiaoyi/i.test(voices[i].name || '')){ fallbackUtterance.voice = voices[i]; break; } }
      window.speechSynthesis.speak(fallbackUtterance);
    }catch(e){}
  }
  var speakQueue = [], speaking = false;
  function edgeSpeakStop(){
    speakGeneration++;
    speakQueue = []; speaking = false;
    if(activeSpeakAudio){ try{ activeSpeakAudio.pause(); activeSpeakAudio.src = ''; }catch(e){} activeSpeakAudio = null; }
    window._edgeAudioRef = null;
    if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }
  function speak(text){
    text = stripTags(text); if(!text || !soundOn || !_unlocked) return;
    speakQueue.push(text);
    if(speaking) return;
    speaking = true;
    var generation = speakGeneration;
    (function pump(){
      if(generation !== speakGeneration){ speaking = false; return; }
      if(!speakQueue.length){ speaking = false; return; }
      var t = speakQueue.shift(); speakQueue = [];
      synthesizeXiaoyi(t, '-5%', '+0Hz').then(function(blob){
        if(generation !== speakGeneration || !blob || !blob.size){ pump(); return; }
        playBlob(blob, generation).then(pump);
      }).catch(function(err){
        if(generation === speakGeneration){
          window.__edgeTTSLastError = err && err.message ? err.message : 'Edge TTS 合成失败';
        }
        speaking = false;
      });
    })();
  }
  function stopSpeak(){ edgeSpeakStop(); }
  window.speakXiaoyi = speak; window.stopSpeakXiaoyi = stopSpeak;
  var pendingWelcome = false, _unlocked = false;
  function _doWelcome(){
    if(_unlocked) return;
    _unlocked = true; soundOn = true; ac();
    if(startOverlay) startOverlay.classList.add('hidden');
    if(startBtn) startBtn.blur();
    playing = true;
    if(pendingWelcome && soundOn){ pendingWelcome = false; speak('欢迎来到口腔健康小课堂'); }
    schedule();
  }
  if(startBtn){ startBtn.addEventListener('click', function(e){ e.stopPropagation(); _doWelcome(); }); }
  // 声音总开关（🔊 播放 / 🔇 静音，静音时同时停止朗读与音效）
  document.getElementById('btnSound').onclick = function(){ this.blur(); soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇'; if(soundOn){ sfxDing(); }else{ stopSpeak(); } };

  /* ===== 圆点与幕牌 ===== */
  scenes.forEach(function(s, i){
    var d = document.createElement('span');
    d.title = '第' + (i+1) + '幕 · ' + NAMES[i];
    d.onclick = function(){ goTo(i); };
    dotsBox.appendChild(d);
  });
  function markDots(){ var ds = dotsBox.children; for(var i=0;i<ds.length;i++){ ds[i].className = i===cur ? 'on' : ''; } }
  function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } if(effectTimer){ clearInterval(effectTimer); effectTimer = null; } sceneTimers.forEach(clearTimeout); sceneTimers = []; }
  function later(fn, ms){ sceneTimers.push(setTimeout(fn, ms)); }

  function setCaption(a, b){
    lineEl.className = 'line'; subEl.className = 'sub';
    lineEl.innerHTML = a || ''; subEl.innerHTML = b || '';
    lineEl.style.display = a ? 'inline-block' : 'none';
    subEl.style.display = b ? 'inline-block' : 'none';
    later(function(){ if(a){ lineEl.className = 'line show'; } if(b){ subEl.className = 'sub show'; } }, 120);
  }

  /* ===== 第4幕：点牙齿刷牙（练习＋即时反馈） ===== */
  var sc4teeth = document.querySelectorAll('#sc4 .tooth');
  var brushDone = false;
  function spawnFoams(r){
    var stage = document.getElementById('stage');
    for(var i=0;i<6;i++){
      var f = document.createElement('div'); f.className = 'foam';
      f.style.left = (r.left + 6 + Math.random() * Math.max(10, r.width - 30)) + 'px';
      f.style.top  = (r.top  + 6 + Math.random() * Math.max(10, r.height - 30)) + 'px';
      stage.appendChild(f); void f.offsetWidth; f.classList.add('go');
      (function(el){ setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, 1500); })(f);
    }
  }
  function showTag(r, text){
    var t = document.createElement('div'); t.className = 'actionTag'; t.textContent = text;
    t.style.left = (r.left + r.width / 2) + 'px';
    t.style.top  = (r.top - 6) + 'px';
    document.getElementById('stage').appendChild(t);
    setTimeout(function(){ if(t.parentNode){ t.parentNode.removeChild(t); } }, 1600);
  }
  Array.prototype.forEach.call(sc4teeth, function(t){
    t.onclick = function(){
      if(cur !== 4 || brushDone) return;
      if(!t.classList.contains('brushable') || t.classList.contains('done')) return;
      t.classList.remove('brushable'); t.classList.add('done', 'wiggle');
      var r = t.getBoundingClientRect();
      spawnFoams(r);
      showTag(r, t.getAttribute('data-act') || '刷刷刷');
      sfxBrush();
      if(document.querySelectorAll('#sc4 .tooth.done').length >= sc4teeth.length){ brushSuccess(); }
    };
  });
  function brushSuccess(){
    brushDone = true;
    hintWrap.style.display = 'none';
    var br = document.getElementById('sc4Brush'), sq = document.getElementById('sc4Squirt');
    br.classList.remove('in'); if(sq){ sq.className = 'squirt'; }
    medalWrap.style.display = 'flex';
    medalWrap.classList.remove('pop-in'); void medalWrap.offsetWidth; medalWrap.classList.add('pop-in');
    sfxCheer();
    speak('哇！三颗牙齿都刷干净啦！细菌全部逃跑！');
    later(function(){ document.querySelectorAll('#sc4 .bug').forEach(function(b){ b.className = 'bug flying'; }); }, 800);
    setCaption(SCRIPTS[4].doneLine, SCRIPTS[4].doneSub);
    if(playing){ timer = setTimeout(function(){ goTo(5); }, 4200); }
  }

  /* ===== 第5幕：护牙小挑战（回忆练习） ===== */
  var qN = document.getElementById('quizN'), qQ = document.getElementById('quizQ'),
      qOpts = document.getElementById('quizOpts'), qMsg = document.getElementById('quizMsg');
  var qi = 0, qLock = false, qDone = false;
  function openQuiz(){
    qi = 0; qLock = false; qDone = false;
    quizEl.classList.add('open');
    document.getElementById('sc5').classList.add('quiz-on');
    renderQuiz();
    later(function(){ speak(qQ.textContent); }, 500);
  }
  function closeQuiz(){
    quizEl.classList.remove('open');
    document.getElementById('sc5').classList.remove('quiz-on');
  }
  function renderQuiz(){
    var item = QUIZ[qi];
    qN.textContent = '第 ' + (qi+1) + ' 题 · 共 ' + QUIZ.length + ' 题';
    qQ.textContent = item.q;
    qMsg.textContent = ''; qMsg.className = '';
    qOpts.innerHTML = '';
    item.opts.forEach(function(text, k){
      var b = document.createElement('button'); b.textContent = text;
      b.onclick = function(){ answerQuiz(b, k); };
      qOpts.appendChild(b);
    });
  }
  function answerQuiz(btn, k){
    if(qLock || qDone) return;
    var item = QUIZ[qi];
    if(k === item.a){
      qLock = true; btn.classList.add('good');
      qMsg.textContent = item.ok; qMsg.className = 'ok';
      sfxDing(); speak(item.ok);
      later(function(){
        qi++; qLock = false;
        if(qi < QUIZ.length){ renderQuiz(); speak(qQ.textContent); }
        else { quizFinish(); }
      }, 1800);
    }else{
      btn.classList.add('shake'); sfxBuzz();
      qMsg.textContent = item.no; qMsg.className = 'no';
      setTimeout(function(){ btn.classList.remove('shake'); }, 500);
    }
  }
  function quizFinish(){
    qDone = true;
    qN.textContent = '挑战完成！';
    qQ.textContent = '🎉 全部答对！';
    qOpts.innerHTML = '';
    qMsg.textContent = '你就是今天的"金牌护牙小卫士"！'; qMsg.className = 'ok';
    var m = document.querySelector('#sc5 .medal');
    if(m){ m.style.animation = 'badgePulse .9s ease-in-out infinite'; }
    sfxCheer(); confetti();
    speak('恭喜你，全部答对！你就是金牌护牙小卫士！');
  }
  function confetti(){
    var colors = ['#ff6b6b','#ffd23f','#63e6be','#74c0fc','#ffa94d','#f783ac','#a9e34b'];
    var stage = document.getElementById('stage');
    for(var i=0;i<48;i++){
      var c = document.createElement('div'); c.className = 'confetti';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      if(Math.random() < .4){ c.style.borderRadius = '50%'; }
      c.style.animationDelay = (Math.random()*.9) + 's';
      c.style.animationDuration = (1.8 + Math.random()*1.4) + 's';
      stage.appendChild(c);
      (function(el){ setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, 4000); })(c);
    }
  }

  /* ===== 各幕演出编排 ===== */
  function sceneEffect(n){
    if(n === 4){
      var tp = document.getElementById('sc4TP');
      var sq = document.getElementById('sc4Squirt');
      var br = document.getElementById('sc4Brush');
      tp.style.opacity = '1'; tp.style.transform = 'rotate(-8deg)';
      tp.style.right = '3%'; tp.style.bottom = '6%'; tp.style.left = 'auto'; tp.style.top = 'auto';
      sq.className = 'squirt'; br.className = 'brush';
      Array.prototype.forEach.call(sc4teeth, function(t){ t.className = 'tooth happy'; });
      document.querySelectorAll('#sc4 .bug').forEach(function(b){ b.className = 'bug'; });
      brushDone = false; hintWrap.style.display = 'none'; medalWrap.style.display = 'none';
      later(function(){  // ① 牙膏移到牙齿上方，管口朝下
        tp.style.right = 'auto'; tp.style.bottom = 'auto';
        tp.style.left = '33%'; tp.style.top = '54%';
        tp.style.transform = 'rotate(90deg)';
      }, 300);
      later(function(){ sq.className = 'squirt go'; }, 1500);   // ② 挤膏体
      later(function(){                                          // ③ 牙膏归位
        tp.style.opacity = '0'; tp.style.left = 'auto'; tp.style.top = 'auto';
        tp.style.right = '3%'; tp.style.bottom = '6%';
      }, 2500);
      later(function(){ br.classList.add('in'); }, 3200);        // ④ 牙刷登场摆动示范
      later(function(){                                          // ⑤ 邀请孩子动手
        if(brushDone) return;
        Array.prototype.forEach.call(sc4teeth, function(t){
          if(!t.classList.contains('done')){ t.classList.add('brushable'); }
        });
        hintWrap.style.display = 'flex';
      }, 4200);
    }
    if(n === 5){
      // 重进本场时复位：乳牙重新鞠躬、恒牙重新飞入
      Array.prototype.forEach.call(document.querySelectorAll('#sc5 .tooth'), function(t){
        if(t.classList.contains('fly-center')){
          t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
        }else{
          t.className = 'tooth bow';
        }
      });
      var m5 = document.querySelector('#sc5 .medal');
      if(m5){ m5.style.animation = 'floatY 2.8s ease-in-out infinite'; }
      setTimeout(function(){ document.querySelectorAll('#sc5 .tooth.bow').forEach(function(t){ t.className = 'tooth shrink-away'; }); }, 1500);
      later(function(){ openQuiz(); }, 4600);
    }
  }

  /* ===== 翻页 ===== */
  function goTo(n){
    clearTimer();
    stopSpeak();
    if(n !== 5){ closeQuiz(); }
    cur = n;
    scenes.forEach(function(s, i){ s.className = i === n ? 'scene active' : 'scene'; });
    var sc = SCRIPTS[n];
    setCaption(sc.line, sc.sub);
// 进入每幕自动朗读介绍（晓伊女声）：封面幕欢迎语由「首次点击」解锁播放（浏览器自动播放策略），其余幕照常朗读台词；静音时不读
    if(soundOn && _unlocked){
      if(n === 0){ pendingWelcome = true; }
      else if(sc.line || sc.sub){ speak(sc.line + (sc.sub ? '。' + sc.sub : '')); }
    } else if(n === 0){
      pendingWelcome = true;
    }
    markDots();
    if(badgeEl){ badgeEl.textContent = '第 ' + (n+1) + ' 幕 / ' + scenes.length + ' · ' + NAMES[n]; }
    sceneEffect(n);
    schedule();
  }
  function schedule(){
    if(!playing) return;
    var sc = SCRIPTS[cur];
    if(!sc.sec || sc.sec <= 0) return;            // 互动幕：停留等待动手，不自动翻页
    if(cur >= scenes.length - 1) return;          // 最后一幕：不再循环回封面
    var next = function(){
      if(!playing) return;
      if(speaking){
        timer = setTimeout(next, 300);            // 等晓伊语音自然播完，再切换下一幕
      }else{
        goTo(cur + 1);
      }
    };
    timer = setTimeout(next, sc.sec * 1000);
  }
  function goNext(){ if(cur < scenes.length - 1){ goTo(cur + 1); } }
  function goPrev(){ if(cur > 0){ goTo(cur - 1); } }
  document.getElementById('btnPrev').onclick = goPrev;
  document.getElementById('btnNext').onclick = goNext;
  document.getElementById('btnPrevBig').onclick = goPrev;
  document.getElementById('btnNextBig').onclick = goNext;
  document.getElementById('btnPlay').onclick = function(){
    playing = !playing;
    this.textContent = playing ? '⏸' : '▶';
    if(playing){
      if(cur === 4 && brushDone){ timer = setTimeout(function(){ goTo(5); }, 1500); }
      else { schedule(); }
    }else{
      if(timer){ clearTimeout(timer); timer = null; }
    }
  };
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ goNext(); }
    if(e.key === 'ArrowLeft'){ goPrev(); }
    if(e.key === ' '){ document.getElementById('btnPlay').click(); e.preventDefault(); }
  });
  if(startOverlay){ startOverlay.classList.remove('hidden'); }
  goTo(0);
})();
</script>
